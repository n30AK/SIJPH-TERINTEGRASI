name: Publish Container Image
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: sijph-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,format=short
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test published container
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}"
          docker pull "$image"
          docker run -d --name sijph-smoke -p 3000:3000 \
            -e DATABASE_URL="postgresql://smoke:smoke@127.0.0.1:5432/smoke" \
            -e SIJPH_ADMIN_API_KEY="smoke-test-only-not-a-secret" \
            -e PUBLIC_INTAKE_ENABLED="false" \
            "$image"
          cleanup() { docker logs sijph-smoke || true; docker rm -f sijph-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            code="$(curl --silent --output /tmp/sijph-home.html --write-out '%{http_code}' http://127.0.0.1:3000/ || true)"
            if [ "$code" = "200" ]; then
              echo "Container served homepage successfully."
              exit 0
            fi
            sleep 2
          done
          echo "Container did not serve homepage with HTTP 200."
          exit 1
