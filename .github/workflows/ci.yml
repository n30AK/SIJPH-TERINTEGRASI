name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: sijph-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          # Build-time placeholder only; production must use hosting secrets.
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/sijph
      - name: Verify production container builds
        run: docker build --tag sijph-terintegrasi:ci .
      - name: Validate offline installer scripts and Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build-offline-bundle.sh scripts/install-offline-bundle.sh
          cat > .env <<'ENVVARS'
          POSTGRES_PASSWORD=ci-placeholder-password
          SIJPH_ADMIN_API_KEY=ci-placeholder-admin-key
          DATA_CONTROLLER_NAME=CI Placeholder
          PRIVACY_CONTACT_EMAIL=ci@example.invalid
          PRIVACY_NOTICE_VERSION=ci-test
          PUBLIC_INTAKE_ENABLED=false
          AI_PROVIDER=openai-compatible
          AI_API_BASE_URL=https://api.openai.com/v1
          AI_API_KEY=
          AI_MODEL=
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          SIJPH_PORT=3000
          SIJPH_IMAGE=sijph-terintegrasi:ci
          ENVVARS
          docker compose config --quiet
          docker compose up -d
          cleanup() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              docker compose ps || true
              docker compose logs --tail=200 || true
            fi
            docker compose down -v || true
            rm -f .env
            exit "$rc"
          }
          trap cleanup EXIT
          app_id=""
          healthy=""
          for attempt in $(seq 1 60); do
            app_id="$(docker compose ps -q app)"
            if [ -n "$app_id" ]; then
              healthy="$(docker inspect --format '{{.State.Health.Status}}' "$app_id" 2>/dev/null || true)"
              if [ "$healthy" = "healthy" ]; then
                break
              fi
            fi
            sleep 2
          done
          test "$healthy" = "healthy"
          curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null
          echo "Compose stack started and homepage returned HTTP 200."
