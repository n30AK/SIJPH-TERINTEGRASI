name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: sijph-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          # Build-time placeholder only; production must use hosting secrets.
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/sijph
      - name: Verify production container builds
        run: docker build --tag sijph-terintegrasi:ci .
      - name: Validate offline installer and run queue API smoke tests
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build-offline-bundle.sh scripts/install-offline-bundle.sh
          cat > .env <<'ENVVARS'
          POSTGRES_PASSWORD=ci-placeholder-password
          SIJPH_ADMIN_API_KEY=ci-placeholder-admin-key
          DATA_CONTROLLER_NAME=CI Placeholder
          PRIVACY_CONTACT_EMAIL=ci@example.invalid
          PRIVACY_NOTICE_VERSION=ci-test
          PUBLIC_INTAKE_ENABLED=false
          AI_PROVIDER=openai-compatible
          AI_API_BASE_URL=https://api.openai.com/v1
          AI_API_KEY=
          AI_MODEL=
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          SIJPH_PORT=3000
          SIJPH_IMAGE=sijph-terintegrasi:ci
          ENVVARS
          docker compose config --quiet
          DATABASE_URL=postgresql://ci:ci@db.example.invalid:5432/sijph DATABASE_SSL=require docker compose -f compose.cloud.yaml config --quiet
          cleanup() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              docker compose ps || true
              docker compose logs --tail=200 || true
            fi
            docker compose down -v || true
            rm -f .env
            exit "$rc"
          }
          trap cleanup EXIT
          docker compose up -d
          app_id=""
          healthy=""
          for attempt in $(seq 1 60); do
            app_id="$(docker compose ps -q app)"
            if [ -n "$app_id" ]; then
              healthy="$(docker inspect --format '{{.State.Health.Status}}' "$app_id" 2>/dev/null || true)"
              if [ "$healthy" = "healthy" ]; then
                break
              fi
            fi
            sleep 2
          done
          test "$healthy" = "healthy"
          curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health > /tmp/sijph-health.json
          grep -q '"database":"connected"' /tmp/sijph-health.json
          admin_header='x-sijph-admin-key: ci-placeholder-admin-key'
          ticket_one="$(curl --fail --silent --show-error -X POST http://127.0.0.1:3000/api/admin/queue -H "$admin_header" -H 'content-type: application/json' -d '{}')"
          ticket_one_no="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).ticket.ticket_no)' "$ticket_one")"
          ticket_one_id="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).ticket.id)' "$ticket_one")"
          test "$ticket_one_no" = "001"
          ticket_two="$(curl --fail --silent --show-error -X POST http://127.0.0.1:3000/api/admin/queue -H "$admin_header" -H 'content-type: application/json' -d '{}')"
          ticket_two_no="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).ticket.ticket_no)' "$ticket_two")"
          ticket_two_id="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).ticket.id)' "$ticket_two")"
          test "$ticket_two_no" = "002"
          # A deleted ticket must not cause its number to be reused.
          docker compose exec -T db psql -v ON_ERROR_STOP=1 -U sijph -d sijph -c "DELETE FROM queue_tickets WHERE id = '$ticket_two_id'" >/dev/null
          ticket_three="$(curl --fail --silent --show-error -X POST http://127.0.0.1:3000/api/admin/queue -H "$admin_header" -H 'content-type: application/json' -d '{}')"
          ticket_three_no="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).ticket.ticket_no)' "$ticket_three")"
          test "$ticket_three_no" = "003"
          # Concurrent requests must receive distinct sequential numbers under the advisory lock.
          pids=()
          for i in 1 2 3 4 5; do
            curl --fail --silent --show-error -X POST http://127.0.0.1:3000/api/admin/queue -H "$admin_header" -H 'content-type: application/json' -d '{}' > "/tmp/sijph-ticket-concurrent-$i.json" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          node -e '
            const fs = require("node:fs");
            const nums = [1,2,3,4,5].map(i => JSON.parse(fs.readFileSync("/tmp/sijph-ticket-concurrent-" + i + ".json", "utf8")).ticket.ticket_no).sort();
            const expected = ["004","005","006","007","008"];
            if (JSON.stringify(nums) !== JSON.stringify(expected)) {
              console.error({ expected, actual: nums });
              process.exit(1);
            }
          '
          invalid_transition_status="$(curl --silent --show-error -o /tmp/sijph-invalid-transition.json -w '%{http_code}' -X PATCH http://127.0.0.1:3000/api/admin/queue -H "$admin_header" -H 'content-type: application/json' -d "{\"ticketId\":\"$ticket_one_id\",\"action\":\"complete\"}")"
          test "$invalid_transition_status" = "409"
          # Legacy numeric labels larger than int32 must not crash ticket issuance.
          docker compose exec -T db psql -v ON_ERROR_STOP=1 -U sijph -d sijph -c "INSERT INTO queue_tickets (ticket_date, ticket_no) VALUES ((now() AT TIME ZONE 'Asia/Jakarta')::date, '999999999999999999999999999999')" >/dev/null
          ticket_large="$(curl --fail --silent --show-error -X POST http://127.0.0.1:3000/api/admin/queue -H "$admin_header" -H 'content-type: application/json' -d '{}')"
          ticket_large_no="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).ticket.ticket_no)' "$ticket_large")"
          test "$ticket_large_no" = "1000000000000000000000000000000"
          echo "Compose stack healthy; queue numbering (deleted, concurrent, large legacy labels) and invalid-transition smoke tests passed."
